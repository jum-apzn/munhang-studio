[package]
name = "munhang-core"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[dependencies]
serde = { version = "1", features = ["derive"] }
base64 = "0.22"
zip = { version = "2", default-features = false, features = ["deflate"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
tempfile = "3"

[dev-dependencies]
serde_json = "1"
roxmltree = "0.20"
