name: Build and verify
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install official Linux build dependencies
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev tesseract-ocr tesseract-ocr-kor poppler-utils
      - name: Prepare Rust stable
        run: rustup update stable && rustup default stable && rustup component add rustfmt clippy
      - run: npm ci
      - run: cargo fmt --all --check
      - run: cargo test --locked --workspace
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: npm test
      - run: npm run build
      - name: Run real Korean OCR and PDF smoke test
        run: cargo test --locked --workspace local_engine_smoke_test -- --ignored
        env:
          MUNHANG_FIXTURES: ${{ github.workspace }}/examples/fixtures
      - name: Build native Tauri application
        run: npm run tauri build -- --no-bundle
      - uses: actions/upload-artifact@v4
        with:
          name: munhang-studio-linux-development-build
          path: src-tauri/target/release/munhang-studio
          if-no-files-found: error
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: rustup update stable
      - run: npm ci
      - run: cargo test --locked --workspace
      - run: npm run build
      - run: npm run tauri build -- --no-bundle
      - uses: actions/upload-artifact@v4
        with:
          name: munhang-studio-windows-development-build
          path: src-tauri/target/release/munhang-studio.exe
          if-no-files-found: error
